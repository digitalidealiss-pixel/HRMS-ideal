<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In — IDEAL HRMS</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/ideal_logo.png" />
  <meta name="theme-color" content="#0B1B36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/hrms.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-3 py-md-5 px-3">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card-enterprise p-4 p-md-5 shadow-sm">
          <div class="mb-3">
            <img src="/assets/images/ideal_logo.png" alt="IDEAL Industrial Synergy Solutions Pvt. Ltd." style="height: 44px; width: auto; object-fit: contain;" />
          </div>
          <h1 class="h4 fw-bold mb-1">IDEAL HRMS</h1>
          <p class="small text-muted mb-4">IDEAL INDUSTRIAL SYNERGY SOLUTIONS PRIVATE LIMITED</p>

          <div id="alertBox" class="alert alert-danger d-none small"></div>
          <div id="successBox" class="alert alert-success d-none small"></div>

          <form id="loginForm" class="d-none">
            <div class="mb-3">
              <label for="loginIdentifier" class="form-label small fw-semibold">Official Email, Employee ID, or Registered Mobile</label>
              <input id="loginIdentifier" type="text" class="form-control" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="name@idealiss.in, IISS-0001, or +91 98XXXXXXXX" required />
            </div>
            <div class="mb-3">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-1">
                <label for="loginPassword" class="form-label small fw-semibold mb-0">Password</label>
                <a href="#" id="forgotPasswordLink" class="small fw-semibold text-decoration-none py-1">Forgot Password? (Admin OTP)</a>
              </div>
              <div class="input-group">
                <input id="loginPassword" type="password" class="form-control" autocomplete="current-password" enterkeyhint="go" placeholder="Enter your password" required />
                <button type="button" class="btn btn-outline-secondary px-3" id="toggleLoginPass" aria-label="Show password">Show</button>
              </div>
            </div>
            <button type="submit" class="btn btn-navy w-100 py-2">Sign In</button>
          </form>

          <form id="forgotRequestForm" class="d-none">
            <div class="mb-2"><a href="#" id="backToLoginFromReq" class="small text-decoration-none d-inline-block py-1">&larr; Back to Sign In</a></div>
            <p class="small fw-semibold text-primary mb-2">Reset Password via Admin OTP</p>
            <p class="small text-muted mb-3">A 6-digit OTP will be sent to the Administrator Console &amp; Admin Email.</p>
            <div class="mb-3">
              <label for="resetIdentifier" class="form-label small fw-semibold">Official Email, Employee ID, or Registered Mobile</label>
              <input id="resetIdentifier" type="text" class="form-control" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="name@idealiss.in, IISS-0001, or +91 98XXXXXXXX" required />
            </div>
            <button type="submit" class="btn btn-navy w-100 py-2">Send 6-Digit OTP to Admin</button>
          </form>

          <form id="forgotVerifyForm" class="d-none">
            <div class="mb-2"><a href="#" id="backToLoginFromVer" class="small text-decoration-none d-inline-block py-1">&larr; Back to Sign In</a></div>
            <p class="small fw-semibold text-success mb-2">Enter 6-Digit OTP from Administrator</p>
            <div class="mb-2">
              <label for="resetOtp" class="form-label small fw-semibold">6-Digit OTP</label>
              <input id="resetOtp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" class="form-control font-monospace text-center fw-bold" placeholder="000000" required />
            </div>
            <div class="mb-2">
              <label for="resetNewPass" class="form-label small fw-semibold">New Password (min 8 chars)</label>
              <input id="resetNewPass" type="password" autocomplete="new-password" minlength="8" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="resetConfirmPass" class="form-label small fw-semibold">Confirm New Password</label>
              <input id="resetConfirmPass" type="password" autocomplete="new-password" minlength="8" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-navy w-100 py-2">Verify OTP &amp; Update Password</button>
          </form>

          <form id="setupForm" class="d-none">
            <p class="small text-primary fw-semibold">Initial Super Admin Setup</p>
            <div class="mb-2"><input id="saName" type="text" autocomplete="name" class="form-control" placeholder="Full Name" required /></div>
            <div class="mb-2"><input id="saEmail" type="email" autocomplete="email" autocapitalize="none" class="form-control" placeholder="Official Email" required /></div>
            <div class="mb-2"><input id="saMobile" type="tel" autocomplete="tel" inputmode="tel" class="form-control" placeholder="Mobile Number" required /></div>
            <div class="mb-3"><input id="saPassword" type="password" autocomplete="new-password" minlength="8" class="form-control" placeholder="Password (min 8 chars)" required /></div>
            <button type="submit" class="btn btn-navy w-100 py-2">Initialize Super Admin</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/config/app-config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const alertBox = document.getElementById('alertBox');
    const successBox = document.getElementById('successBox');
    const loginForm = document.getElementById('loginForm');
    const setupForm = document.getElementById('setupForm');
    const forgotRequestForm = document.getElementById('forgotRequestForm');
    const forgotVerifyForm = document.getElementById('forgotVerifyForm');

    const toggleLoginPass = document.getElementById('toggleLoginPass');
    const loginPassInput = document.getElementById('loginPassword');
    toggleLoginPass.addEventListener('click', () => {
      const hidden = loginPassInput.type === 'password';
      loginPassInput.type = hidden ? 'text' : 'password';
      toggleLoginPass.textContent = hidden ? 'Hide' : 'Show';
    });

    function showOnly(formEl) {
      [loginForm, setupForm, forgotRequestForm, forgotVerifyForm].forEach((f) => f.classList.add('d-none'));
      formEl.classList.remove('d-none');
    }

    (async function init() {
      try {
        const res = await window.IdealApi.call('setupStatus');
        showOnly(res.needsInitialSetup ? setupForm : loginForm);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
        showOnly(loginForm);
      }
    })();

    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      successBox.classList.add('d-none');
      document.getElementById('resetIdentifier').value = document.getElementById('loginIdentifier').value;
      showOnly(forgotRequestForm);
    });

    [document.getElementById('backToLoginFromReq'), document.getElementById('backToLoginFromVer')].forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        showOnly(loginForm);
      });
    });

    forgotRequestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      try {
        const res = await window.IdealApi.call('requestPasswordResetOtp', {
          identifier: document.getElementById('resetIdentifier').value.trim()
        });
        successBox.textContent = res.message;
        successBox.classList.remove('d-none');
        showOnly(forgotVerifyForm);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    });

    const resetOtpInput = document.getElementById('resetOtp');
    if (resetOtpInput) {
      resetOtpInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      });
    }

    forgotVerifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      const otpVal = document.getElementById('resetOtp').value.trim();
      if (!/^\d{6}$/.test(otpVal)) {
        alertBox.textContent = 'OTP must be a 6-digit numeric code (digits 0-9 only).';
        alertBox.classList.remove('d-none');
        return;
      }
      const p1 = document.getElementById('resetNewPass').value;
      const p2 = document.getElementById('resetConfirmPass').value;
      if (p1 !== p2) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.classList.remove('d-none');
        return;
      }
      try {
        const res = await window.IdealApi.call('verifyPasswordResetOtp', {
          identifier: document.getElementById('resetIdentifier').value.trim(),
          otp: otpVal,
          newPassword: p1
        });
        successBox.textContent = res.message;
        successBox.classList.remove('d-none');
        showOnly(loginForm);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      try {
        const res = await window.IdealApi.call('login', {
          identifier: document.getElementById('loginIdentifier').value,
          password: document.getElementById('loginPassword').value
        });
        window.IdealApi.saveSession(res.token, res.user);
        window.location.href = (res.user.role === 'EMPLOYEE') ? '/employee.html' : '/admin.html';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    });

    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      try {
        const res = await window.IdealApi.call('initSuperAdmin', {
          fullName: document.getElementById('saName').value,
          email: document.getElementById('saEmail').value,
          mobile: document.getElementById('saMobile').value,
          password: document.getElementById('saPassword').value
        });
        window.IdealApi.saveSession(res.token, res.user);
        window.location.href = '/admin.html';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
