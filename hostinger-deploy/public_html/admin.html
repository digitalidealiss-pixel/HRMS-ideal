<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Console — IDEAL HRMS</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/ideal_logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/hrms.css" rel="stylesheet" />
</head>
<body>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
  <div class="d-flex min-vh-100">
    <aside id="adminSidebar" class="hrms-sidebar p-3 d-flex flex-column">
      <div class="pb-3 mb-3 border-bottom border-secondary d-flex justify-content-between align-items-start gap-2">
        <div>
          <div class="bg-white rounded p-2 mb-2 d-inline-block">
            <img src="/assets/images/ideal_logo.png" alt="IDEAL" style="height: 28px; width: auto; object-fit: contain;" />
          </div>
          <div class="brand-title fw-bold">IDEAL HRMS</div>
          <div class="small text-secondary">Admin Console</div>
        </div>
        <button id="closeSidebarBtn" type="button" class="btn btn-sm btn-outline-light d-md-none" aria-label="Close navigation menu">&times;</button>
      </div>
      <nav class="nav flex-column gap-1 flex-grow-1" id="adminNav">
        <a href="#dashboard" class="nav-link active" data-section="dashboard">Dashboard &amp; Charts</a>
        <a href="#employees" class="nav-link" data-section="employees">Employees</a>
        <a href="#roles" class="nav-link" data-section="roles">Roles &amp; Departments</a>
        <a href="#attendance" class="nav-link" data-section="attendance">Attendance</a>
        <a href="#location" class="nav-link" data-section="location">Live Field GPS</a>
        <a href="#travel" class="nav-link" data-section="travel">Travel &amp; Conveyance</a>
        <a href="#food" class="nav-link" data-section="food">Food Allowance</a>
        <a href="#leaves" class="nav-link" data-section="leaves">Leaves</a>
        <a href="#payroll" class="nav-link" data-section="payroll">Payroll</a>
      </nav>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm mt-3">Sign Out</button>
    </aside>

    <main class="hrms-main flex-grow-1 p-3 p-md-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 bg-white bg-opacity-75 rounded-3 border p-2 px-3">
        <div class="d-flex align-items-center gap-2">
          <button id="mobileMenuToggle" type="button" class="btn btn-outline-dark btn-sm d-md-none px-3" aria-label="Open navigation menu">&#9776; Menu</button>
          <h2 class="h5 fw-bold mb-0" id="pageTitle">Executive Overview</h2>
        </div>
        <span id="userLabel" class="small text-muted tabular-nums text-truncate" style="max-width: 100%;"></span>
      </div>

      <div id="kpiRow" class="row g-3 mb-4"></div>
      <div class="card-enterprise p-3 p-md-4 mb-4">
        <h3 class="h6 fw-semibold mb-3">Department Headcount &amp; Attendance</h3>
        <canvas id="adminChart" height="100"></canvas>
      </div>
      <div id="otpMount" class="card-enterprise p-3 p-md-4 mb-4"></div>
      <div id="tableMount" class="card-enterprise p-3 p-md-4"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/config/app-config.js"></script>
  <script src="/assets/js/indexeddb.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
